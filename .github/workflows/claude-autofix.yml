name: Claude AutoFix

on:
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude AutoFix
        uses: enriconunes/claude-autofix-action@v2.1.2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
