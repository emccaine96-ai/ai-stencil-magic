name: Deploy Claude Agent

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Claude Agent
        uses: LukeLalor/claude-deploy@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
